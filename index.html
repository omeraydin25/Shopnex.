<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopnex V3</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f0f13;
color:#fff;
display:flex;
}

/* SIDEBAR */
.sidebar{
width:220px;
height:100vh;
background:#1a1a20;
padding:20px;
position:fixed;
}
.sidebar h2{color:#6c5ce7}
.sidebar button{
width:100%;
margin-top:10px;
padding:10px;
background:#2a2a33;
border:none;
color:#fff;
border-radius:8px;
cursor:pointer;
}

/* MAIN */
.main{
margin-left:240px;
padding:20px;
width:100%;
}

.page{display:none}
.page.active{display:block}

/* CARDS */
.cards{
display:flex;
gap:10px;
flex-wrap:wrap;
}
.card{
flex:1;
min-width:150px;
background:#1a1a20;
padding:15px;
border-radius:10px;
}

/* PANEL */
.panel{
margin-top:20px;
padding:15px;
background:#1a1a20;
border-radius:10px;
}

/* BUTTON */
button{
background:#6c5ce7;
color:#fff;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
}

/* CHART */
.chart{
display:flex;
align-items:flex-end;
gap:10px;
height:200px;
margin-top:20px;
}
.bar{
flex:1;
background:#6c5ce7;
border-radius:8px;
}

/* CHAT */
.chat{
height:300px;
background:#1a1a20;
padding:10px;
overflow:auto;
border-radius:10px;
}

.msg{
padding:8px;
margin:5px 0;
border-radius:6px;
}

.user{background:#6c5ce7}
.bot{background:#2a2a33}

.inputBox{
display:flex;
margin-top:10px;
}

input{
flex:1;
padding:10px;
border:none;
outline:none;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<h2>Shopnex</h2>
<button onclick="setPage('dashboard')">📊 Dashboard</button>
<button onclick="setPage('analytics')">📈 Analytics</button>
<button onclick="setPage('ai')">🤖 AI</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboard" class="page active">
<h1>Dashboard</h1>

<div class="cards">
<div class="card">Instagram<br><b id="ig">12K</b></div>
<div class="card">TikTok<br><b id="tt">35K</b></div>
<div class="card">YouTube<br><b id="yt">8K</b></div>
</div>

<div class="panel">
<h3>Hızlı Güncelle</h3>
<button onclick="update()">Veri Güncelle</button>
</div>
</div>

<!-- ANALYTICS -->
<div id="analytics" class="page">
<h1>Analytics</h1>

<div class="chart">
<div class="bar" style="height:30%"></div>
<div class="bar" style="height:60%"></div>
<div class="bar" style="height:40%"></div>
<div class="bar" style="height:80%"></div>
</div>
</div>

<!-- AI -->
<div id="ai" class="page">
<h1>AI Asistan</h1>

<div class="chat" id="chat"></div>

<div class="inputBox">
<input id="input" placeholder="Mesaj yaz...">
<button onclick="send()">Gönder</button>
</div>
</div>

</div>

<script>

// PAGE SWITCH
function setPage(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"))
document.getElementById(id).classList.add("active")
}

// FAKE DATA UPDATE
function update(){
document.getElementById("ig").innerText=(10+Math.random()*10).toFixed(1)+"K"
document.getElementById("tt").innerText=(30+Math.random()*20).toFixed(1)+"K"
document.getElementById("yt").innerText=(5+Math.random()*10).toFixed(1)+"K"
}

// CHAT SYSTEM
function send(){
let input=document.getElementById("input")
let chat=document.getElementById("chat")

if(!input.value.trim())return;

chat.innerHTML+=`<div class="msg user">${input.value}</div>`

let text=input.value.toLowerCase()
let reply="Size yardımcı olabilirim."

if(text.includes("instagram")) reply="Instagram analizi hazır."
if(text.includes("tiktok")) reply="TikTok verileri inceleniyor."
if(text.includes("youtube")) reply="YouTube büyüme raporu hazır."

setTimeout(()=>{
chat.innerHTML+=`<div class="msg bot">${reply}</div>`
chat.scrollTop=9999
},400)

input.value=""
}

</script>

</body>
</html>
