<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baydınsal.OyunHizmetleri - Satış</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1e1e24;
            --primary: #6c5ce7;
            --accent: #00cec9;
            --text: #ffffff;
            --text-muted: #b2bec3;
            --danger: #ff7675;
            --success: #00b894;
            --border: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
        }

        /* Header */
        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--text);
        }

        .search-bar {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid var(--border);
            background: #2d2d35;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.3);
        }

        .cart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .cart-btn:hover {
            background: #5649c0;
        }

        .cart-count {
            background: var(--danger);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        /* Main Content */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Sidebar Filters */
        .sidebar {
            flex: 1;
            min-width: 250px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            height: fit-content;
        }

        .filter-group {
            margin-bottom: 25px;
        }

        .filter-group h3 {
            margin-bottom: 15px;
            color: var(--accent);
            font-size: 1.1rem;
        }

        .filter-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(108, 92, 231, 0.1);
            color: var(--primary);
        }

        /* Product Grid */
        .products-grid {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border-color: var(--primary);
        }

        .product-img {
            height: 180px;
            background: linear-gradient(45deg, #2d3436, #000);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 3rem;
            position: relative;
        }

        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--success);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .product-info {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .product-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.4;
            flex: 1;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .price {
            font-size: 1.3rem;
            color: var(--accent);
            font-weight: bold;
        }

        .add-cart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-cart-btn:hover {
            background: #5649c0;
        }

        /* Cart Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            width: 90%;
            max-width: 500px;
            border-radius: 12px;
            padding: 25px;
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .cart-total {
            margin-top: 20px;
            text-align: right;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
        }

        .checkout-btn {
            width: 100%;
            background: var(--success);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .checkout-btn:hover {
            background: #00a383;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                order: 2;
            }
            .products-grid {
                order: 1;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">🎮 Baydınsal<span>.OyunHizmetleri</span></a>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Hesap, skin veya oyun ara...">
    </div>
    <button class="cart-btn" onclick="toggleCart()">
        🛒 Sepetim <span class="cart-count" id="cartCount">0</span>
    </button>
</header>

<div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="filter-group">
            <h3>Kategoriler</h3>
            <button class="filter-btn active" onclick="filterProducts('all')">Tümü</button>
            <button class="filter-btn" onclick="filterProducts('pubg')">PUBG Mobile</button>
            <button class="filter-btn" onclick="filterProducts('cod')">Call of Duty</button>
            <button class="filter-btn" onclick="filterProducts('freefire')">Free Fire</button>
            <button class="filter-btn" onclick="filterProducts('valorant')">Valorant</button>
        </div>
        
        <div class="filter-group">
            <h3>Fiyat Aralığı</h3>
            <button class="filter-btn" onclick="sortPrice('asc')">Düşükten Yükseğe</button>
            <button class="filter-btn" onclick="sortPrice('desc')">Yüksekten Düşüğe</button>
        </div>
    </aside>

    <!-- Products -->
    <main class="products-grid" id="productsContainer">
        <!-- Ürünler JS ile buraya gelecek -->
    </main>
</div>

<!-- Cart Modal -->
<div id="cartModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="toggleCart()">&times;</span>
        <h2>Sepetiniz</h2>
        <div id="cartItems">
            <p style="color: var(--text-muted); text-align: center; margin: 20px 0;">Sepetiniz boş.</p>
        </div>
        <div class="cart-total">
            Toplam: <span id="totalPrice">0 ₺</span>
        </div>
        <button class="checkout-btn" onclick="alert('Ödeme sayfasına yönlendiriliyorsunuz (Demo)')">Ödemeyi Tamamla</button>
    </div>
</div>

<script>
    // Örnek Ürün Verileri
    const products = [
        { id: 1, title: "PUBG - Mythic Elbise + 5000 UC", category: "pubg", price: 1250, desc: "Mythic set, tüm silah skinleri ve yüksek level.", image: "🔫" },
        { id: 2, title: "COD Mobile - Level 150 + Tüm Silahlar", category: "cod", price: 850, desc: "Max level, legendary skinler ve rank ödülleri.", image: "💀" },
        { id: 3, title: "Valorant - Radiant Rank + Skinler", category: "valorant", price: 2100, desc: "Radiant rank, Vandal ve Phantom skinleri.", image: "⚡" },
        { id: 4, title: "Free Fire - Max Level + Karakterler", category: "freefire", price: 450, desc: "Max karakter skilleri ve özel kostümler.", image: "🔥" },
        { id: 5, title: "PUBG - Conqueror Sıralaması", category: "pubg", price: 3500, desc: "Conqueror rozeti, özel elbise seti.", image: "👑" },
        { id: 6, title: "Genshin Impact - AR 60 + 5 Yıldızlılar", category: "pubg", price: 1800, desc: "AR 60, tüm karakterler ve weaponlar.", image: "✨" },
        { id: 7, title: "LoL - Prestige Skin + Rütbe", category: "valorant", price: 950, desc: "Prestige skin koleksiyonu ve Diamond rütbe.", image: "🛡️" },
        { id: 8, title: "PUBG - Yeni Başlayan Hesap", category: "pubg", price: 150, desc: "Temiz hesap, başlangıç için ideal.", image: "🎯" }
    ];

    let cart = ;
    let currentFilter = 'all';

    // Sayfa Yüklendiğinde
    document.addEventListener('DOMContentLoaded', () => {
        renderProducts(products);
    });

    // Ürünleri Listeleme
    function renderProducts(data) {
        const container = document.getElementById('productsContainer');
        container.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Ürün bulunamadı.</p>';
            return;
        }

        data.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="product-img">
                    \${product.image}
                    <span class="badge">Stokta Var</span>
                </div>
                <div class="product-info">
                    <h3 class="product-title">\${product.title}</h3>
                    <p class="product-desc">\${product.desc}</p>
                    <div class="product-meta">
                        <span class="price">\${product.price} ₺</span>
                        <button class="add-cart-btn" onclick="addToCart(\${product.id})">Sepete Ekle</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Filtreleme
    function filterProducts(category) {
        currentFilter = category;
        
        // Aktif buton güncelleme
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        if (category === 'all') {
            renderProducts(products);
        } else {
            const filtered = products.filter(p => p.category === category);
            renderProducts(filtered);
        }
    }

    // Sıralama
    function sortPrice(order) {
        let sorted = [...products];
        if (currentFilter !== 'all') {
            sorted = sorted.filter(p => p.category === currentFilter);
        }
        
        sorted.sort((a, b) => order === 'asc' ? a.price - b.price : b.price - a.price);
        renderProducts(sorted);
    }

    // Arama
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = products.filter(p => 
            p.title.toLowerCase().includes(term) || 
            p.desc.toLowerCase().includes(term)
        );
        renderProducts(filtered);
    });

    // Sepet İşlemleri
    function addToCart(id) {
        const product = products.find(p => p.id === id);
        cart.push(product);
        updateCartUI();
        
        // Küçük animasyon efekti
        const btn = event.target;
        const originalText = btn.innerText;
        btn.innerText = "Eklendi ✓";
        btn.style.background = "#00b894";
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.background = "";
        }, 1000);
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartUI();
    }

    function updateCartUI() {
        document.getElementById('cartCount').innerText = cart.length;
        
        const cartItemsContainer = document.getElementById('cartItems');
        const totalPriceEl = document.getElementById('totalPrice');
        
        if (cart.length === 0) {
            cartItemsContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin: 20px 0;">Sepetiniz boş.</p>';
            totalPriceEl.innerText = '0 ₺';
            return;
        }

        let total = 0;
        let html = '';
        
        cart.forEach((item, index) => {
            total += item.price;
            html += `
                <div class="cart-item">
                    <div>
                        <strong>\${item.title}</strong><br>
                        <small>\${item.price} ₺</small>
                    </div>
                    <button onclick="removeFromCart(\${index})" style="background:none; border:none; color:var(--danger); cursor:pointer;">Sil</button>
                </div>
            `;
        });

        cartItemsContainer.innerHTML = html;
        totalPriceEl.innerText = total + ' ₺';
    }

    function toggleCart() {
        const modal = document.getElementById('cartModal');
        modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    // Modal dışına tıklayınca kapatma
    window.onclick = function(event) {
        const modal = document.getElementById('cartModal');
        if (event.target == modal) {
            modal.style.display = 'none';
        }
    }
</script>

</body>
</html>
