<!DOCTYPE html>
<html lang="tr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>ShopNex - Yapay Zeka Asistanı</title>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
 <style>
 :root {
 --primary-color: #2563eb;
 --secondary-color: #1e40af;
 --accent-color: #3b82f6;
 --background-light: #f8fafc;
 --text-dark: #1e293b;
 --text-light: #64748b;
 --white: #ffffff;
 --border-radius: 12px;
 --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
 }

 * {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 }

 body {
 font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
 background: var(--background-light);
 color: var(--text-dark);
 line-height: 1.6;
 }

 .container {
 max-width: 1200px;
 margin: 0 auto;
 padding: 20px;
 }

 /* Header */
 .header {
 background: var(--white);
 padding: 1rem 0;
 box-shadow: var(--shadow);
 position: sticky;
 top: 0;
 z-index: 100;
 }

 .header-content {
 display: flex;
 justify-content: space-between;
 align-items: center;
 max-width: 1200px;
 margin: 0 auto;
 padding: 0 20px;
 }

 .logo {
 font-size: 1.5rem;
 font-weight: bold;
 color: var(--primary-color);
 }

 /* Language Selector */
 .language-selector {
 position: relative;
 }

 .language-btn {
 background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
 color: white;
 border: none;
 padding: 8px 16px;
 border-radius: 20px;
 cursor: pointer;
 display: flex;
 align-items: center;
 gap: 8px;
 font-weight: 500;
 }

 .language-dropdown {
 position: absolute;
 top: 100%;
 right: 0;
 background: white;
 border-radius: var(--border-radius);
 box-shadow: var(--shadow);
 min-width: 200px;
 display: none;
 z-index: 1000;
 margin-top: 8px;
 }

 .language-dropdown.active {
 display: block;
 }

 .language-option {
 padding: 12px 16px;
 display: flex;
 align-items: center;
 gap: 12px;
 cursor: pointer;
 transition: background 0.2s;
 }

 .language-option:hover {
 background: var(--background-light);
 }

 .flag-icon {
 width: 24px;
 height: 24px;
 border-radius: 50%;
 object-fit: cover;
 }

 /* Chat Widget */
 .chat-widget {
 position: fixed;
 bottom: 20px;
 right: 20px;
 z-index: 1000;
 }

 .chat-button {
 background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
 color: white;
 border: none;
 width: 60px;
 height: 60px;
 border-radius: 50%;
 cursor: pointer;
 box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
 transition: transform 0.2s;
 }

 .chat-button:hover {
 transform: scale(1.1);
 }

 .chat-window {
 position: fixed;
 bottom: 100px;
 right: 20px;
 width: 350px;
 height: 500px;
 background: white;
 border-radius: var(--border-radius);
 box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
 display: none;
 flex-direction: column;
 overflow: hidden;
 }

 .chat-header {
 background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
 color: white;
 padding: 16px;
 display: flex;
 justify-content: space-between;
 align-items: center;
 }

 .chat-messages {
 flex: 1;
 overflow-y: auto;
 padding: 16px;
 background: var(--background-light);
 }

 .message {
 margin-bottom: 12px;
 max-width: 80%;
 padding: 12px 16px;
 border-radius: 18px;
 line-height: 1.4;
 }

 .message.user {
 background: var(--primary-color);
 color: white;
 margin-left: auto;
 border-bottom-right-radius: 4px;
 }

 .message.ai {
 background: white;
 border: 1px solid #e2e8f0;
 margin-right: auto;
 border-bottom-left-radius: 4px;
 }

 .chat-input-area {
 padding: 16px;
 border-top: 1px solid #e2e8f0;
 display: flex;
 gap: 8px;
 }

 .chat-input {
 flex: 1;
 padding: 12px;
 border: 1px solid #e2e8f0;
 border-radius: 20px;
 outline: none;
 font-size: 14px;
 }

 .chat-input:focus {
 border-color: var(--primary-color);
 }

 .send-button {
 background: var(--primary-color);
 color: white;
 border: none;
 width: 40px;
 height: 40px;
 border-radius: 50%;
 cursor: pointer;
 display: flex;
 align-items: center;
 justify-content: center;
 transition: background 0.2s;
 }

 .send-button:hover {
 background: var(--secondary-color);
 }

 .send-button:disabled {
 background: #cbd5e1;
 cursor: not-allowed;
 }

 /* Responsive */
 @media (max-width: 768px) {
 .chat-window {
 width: calc(100% - 40px);
 right: 20px;
 bottom: 100px;
 }
 
 .header-content {
 flex-direction: column;
 gap: 12px;
 }
 }
 </style>
</head>
<body>
 <!-- Header -->
 <header class="header">
 <div class="header-content">
 <div class="logo">ShopNex</div>
 
 <!-- Language Selector -->
 <div class="language-selector">
 <button class="language-btn" id="languageBtn">
 <img src="https://flagcdn.com/w40/tr.png" alt="Türkçe" class="flag-icon">
 Türkçe
 </button>
 <div class="language-dropdown" id="languageDropdown">
 <div class="language-option" data-lang="tr">
 <img src="https://flagcdn.com/w40/tr.png" alt="Türkçe" class="flag-icon">
 Türkçe
 </div>
 <div class="language-option" data-lang="en">
 <img src="https://flagcdn.com/w40/gb.png" alt="English" class="flag-icon">
 English
 </div>
 <div class="language-option" data-lang="de">
 <img src="https://flagcdn.com/w40/de.png" alt="Deutsch" class="flag-icon">
 Deutsch
 </div>
 <div class="language-option" data-lang="es">
 <img src="https://flagcdn.com/w40/es.png" alt="Español" class="flag-icon">
 Español
 </div>
 </div>
 </div>
 </div>
 </header>

 <!-- Chat Widget -->
 <div class="chat-widget">
 <button class="chat-button" id="chatToggle">
 <i class="fas fa-comment-dots"></i>
 </button>
 
 <div class="chat-window" id="chatWindow">
 <div class="chat-header">
 <span><i class="fas fa-robot"></i> Yapay Zeka Asistanı</span>
 <button id="closeChat" style="background:none;border:none;color:white;cursor:pointer;">
 <i class="fas fa-times"></i>
 </button>
 </div>
 
 <div class="chat-messages" id="chatMessages">
 <div class="message ai">
 Merhaba! Size nasıl yardımcı olabilirim? 😊
 </div>
 </div>
 
 <div class="chat-input-area">
 <input type="text" class="chat-input" id="chatInput" placeholder="Mesajınızı yazın...">
 <button class="send-button" id="sendButton">
 <i class="fas fa-paper-plane"></i>
 </button>
 </div>
 </div>
 </div>

 <script>
 // Language Selector Logic
 const languageBtn = document.getElementById('languageBtn');
 const languageDropdown = document.getElementById('languageDropdown');
 const languageOptions = document.querySelectorAll('.language-option');

 languageBtn.addEventListener('click', (e) => {
 e.stopPropagation();
 languageDropdown.classList.toggle('active');
 });

 document.addEventListener('click', () => {
 languageDropdown.classList.remove('active');
 });

 languageOptions.forEach(option => {
 option.addEventListener('click', () => {
 const lang = option.dataset.lang;
 const flagUrl = option.querySelector('img').src;
 const langName = option.textContent.trim();
 
 languageBtn.innerHTML = `<img src="\${flagUrl}" alt="\${langName}" class="flag-icon">\${langName}`;
 languageDropdown.classList.remove('active');
 
 // Dil değiştirme işlemi burada yapılır
 console.log(`Dil değiştirildi: \${langName}`);
 });
 });

 // Chat Widget Logic
 const chatToggle = document.getElementById('chatToggle');
 const chatWindow = document.getElementById('chatWindow');
 const closeChat = document.getElementById('closeChat');
 const chatInput = document.getElementById('chatInput');
 const sendButton = document.getElementById('sendButton');
 const chatMessages = document.getElementById('chatMessages');

 chatToggle.addEventListener('click', () => {
 chatWindow.style.display = chatWindow.style.display === 'flex' ? 'none' : 'flex';
 });

 closeChat.addEventListener('click', () => {
 chatWindow.style.display = 'none';
 });

 function addMessage(text, isUser) {
 const messageDiv = document.createElement('div');
 messageDiv.className = `message \${isUser ? 'user' : 'ai'}`;
 messageDiv.textContent = text;
 chatMessages.appendChild(messageDiv);
 chatMessages.scrollTop = chatMessages.scrollHeight;
 }

 async function sendMessage() {
 const message = chatInput.value.trim();
 if (!message) return;

 addMessage(message, true);
 chatInput.value = '';
 sendButton.disabled = true;

 // Simulated AI response - Replace with actual API call
 setTimeout(() => {
 addMessage("Bu bir demo cevaptır. Gerçek bir API bağlantısı kurulduğunda profesyonel cevaplar alacaksınız.", false);
 sendButton.disabled = false;
 }, 1000);
 }

 sendButton.addEventListener('click', sendMessage);
 
 chatInput.addEventListener('keypress', (e) => {
 if (e.key === 'Enter') {
 sendMessage();
 }
 });

 // Initialize with current language
 let currentLanguage = 'tr';
 </script>
</body>
</html>
