<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO Web Site</title>

<style>
:root {
 --primary: #6366f1;
 --bg: #0f172a;
 --text: #fff;
}

body.light {
 --bg: #f1f5f9;
 --text: #000;
}

body {
 margin:0;
 font-family: Arial;
 background: var(--bg);
 color: var(--text);
 transition: 0.4s;
}

/* NAVBAR */
nav {
 display:flex;
 justify-content:space-between;
 padding:15px 30px;
 background: rgba(0,0,0,0.5);
 position: sticky;
 top:0;
}

nav a {
 color:white;
 text-decoration:none;
 margin:0 10px;
}

/* HERO */
.hero {
 text-align:center;
 padding:100px 20px;
}

.hero h1 {
 font-size:50px;
}

.btn {
 background:var(--primary);
 padding:15px 30px;
 border:none;
 border-radius:30px;
 color:white;
 cursor:pointer;
 transition:0.3s;
}

.btn:hover {
 transform:scale(1.1);
}

/* CARDS */
.cards {
 display:grid;
 grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
 gap:20px;
 padding:50px;
}

.card {
 background:rgba(255,255,255,0.1);
 padding:20px;
 border-radius:15px;
 transition:0.3s;
}

.card:hover {
 transform:translateY(-10px);
}

/* COUNTER */
.counter {
 text-align:center;
 font-size:40px;
 margin:50px;
}

/* POPUP */
.popup {
 position:fixed;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%) scale(0);
 background:white;
 color:black;
 padding:30px;
 border-radius:15px;
 transition:0.3s;
}

.popup.active {
 transform:translate(-50%,-50%) scale(1);
}

/* FOOTER */
footer {
 text-align:center;
 padding:20px;
 background:black;
}

</style>
</head>

<body>

<nav>
 <h2>Shopnex</h2>
 <div>
  <a href="#">Ana Sayfa</a>
  <a href="#">Hakkında</a>
  <a href="#">İletişim</a>
 </div>
 <button onclick="toggleMode()">🌙</button>
</nav>

<section class="hero">
 <h1>PRO WEB SİTESİ</h1>
 <p>En gelişmiş siteyi yaptın</p>
 <button class="btn" onclick="openPopup()">Başla</button>
</section>

<section class="cards">
 <div class="card">🚀 Hızlı</div>
 <div class="card">💎 Kaliteli</div>
 <div class="card">🔥 Modern</div>
</section>

<div class="counter" id="counter">0</div>

<div class="popup" id="popup">
 <h2>Hoşgeldin!</h2>
 <button onclick="closePopup()">Kapat</button>
</div>

<footer>
 © 2026 Tüm haklar saklı
</footer>

<script>

/* DARK MODE */
function toggleMode(){
 document.body.classList.toggle("light")
}

/* COUNTER */
let count = 0;
let counter = document.getElementById("counter");

setInterval(()=>{
 count++;
 counter.innerText = count;
},50);

/* POPUP */
function openPopup(){
 document.getElementById("popup").classList.add("active")
}

function closePopup(){
 document.getElementById("popup").classList.remove("active")
}

</script>

</body>
</html>
