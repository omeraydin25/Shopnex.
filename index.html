<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopnex AI E-Ticaret</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
--primary:#0f172a;
--accent:#2563eb;
--border:#e2e8f0;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Inter;}

body{background:#fff;color:var(--primary);transition:.3s;}

body.dark{background:#020617;color:white;}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(15px);
border-bottom:1px solid var(--border);
z-index:999;
}

body.dark nav{background:rgba(2,6,23,0.9);}

.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
max-width:1200px;
margin:auto;
}

.logo{font-weight:900;color:var(--accent);font-size:22px;}

/* MENU */
.menu{
position:fixed;
left:-100%;
top:0;
width:260px;
height:100vh;
background:white;
padding:80px 20px;
transition:.3s;
z-index:998;
}

body.dark .menu{background:#0f172a;}

.menu.active{left:0;}

.menu a{display:block;padding:12px;text-decoration:none;color:inherit;font-weight:600;}

/* HAMBURGER */
.hamburger{cursor:pointer;}
.hamburger div{width:28px;height:3px;background:var(--primary);margin:5px;}

body.dark .hamburger div{background:white;}

/* LANGUAGE */
.lang-btn{
padding:6px 10px;
border:1px solid var(--border);
border-radius:8px;
background:none;
cursor:pointer;
}

.lang-box{
position:absolute;
top:45px;
right:0;
background:white;
border:1px solid var(--border);
display:none;
max-height:300px;
overflow:auto;
}

.lang-box.active{display:block;}

.lang-item{padding:10px;cursor:pointer;}
.lang-item:hover{background:#f1f5f9;}

/* CHAT */
.chat-btn{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:var(--accent);
color:white;
border:none;
cursor:pointer;
}

.chat{
position:fixed;
bottom:90px;
right:20px;
width:340px;
height:450px;
background:white;
display:none;
flex-direction:column;
border-radius:12px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.chat-header{
background:var(--accent);
color:white;
padding:10px;
display:flex;
justify-content:space-between;
}

.chat-body{
flex:1;
padding:10px;
overflow:auto;
background:#f8fafc;
}

.msg{margin:6px 0;padding:8px;border-radius:10px;max-width:80%;}

.user{background:var(--accent);color:white;margin-left:auto;}
.ai{background:white;border:1px solid #ddd;}

.chat-input{
display:flex;
border-top:1px solid #ddd;
}

.chat-input input{
flex:1;
padding:10px;
border:none;
outline:none;
}

.chat-input button{
background:var(--accent);
color:white;
border:none;
padding:10px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<div class="nav">

<div class="hamburger" onclick="toggleMenu()">
<div></div><div></div><div></div>
</div>

<div class="logo">Shopnex</div>

<div style="display:flex;gap:10px;align-items:center">

<div style="position:relative">
<button class="lang-btn" onclick="toggleLang()">TR</button>
<div class="lang-box" id="langBox"></div>
</div>

<button onclick="toggleTheme()">🌓</button>

</div>
</div>
</nav>

<!-- MENU -->
<div class="menu" id="menu">
<a href="#">Ana Sayfa</a>
<a href="#">Ürünler</a>
<a href="#">AI</a>
<a href="#">İletişim</a>
</div>

<!-- CHAT -->
<button class="chat-btn" onclick="toggleChat()">💬</button>

<div class="chat" id="chat">
<div class="chat-header">
AI
<span onclick="toggleChat()" style="cursor:pointer">✖</span>
</div>

<div class="chat-body" id="chatBody">
<div class="msg ai">Merhaba 👋</div>
</div>

<div class="chat-input">
<input id="input" placeholder="Yaz...">
<button onclick="send()">➤</button>
</div>
</div>

<script>

/* MENU */
function toggleMenu(){
document.getElementById("menu").classList.toggle("active");
}

/* THEME */
function toggleTheme(){
document.body.classList.toggle("dark");
}

/* CHAT */
function toggleChat(){
let c=document.getElementById("chat");
c.style.display=c.style.display==="flex"?"none":"flex";
}

/* SEND */
function send(){
let i=document.getElementById("input");
if(!i.value)return;

let u=document.createElement("div");
u.className="msg user";
u.innerText=i.value;
document.getElementById("chatBody").appendChild(u);

setTimeout(()=>{
let a=document.createElement("div");
a.className="msg ai";
a.innerText="AI cevap: "+i.value;
document.getElementById("chatBody").appendChild(a);
},800);

i.value="";
}

/* LANG */
const langs=["TR Türkçe","EN English","DE Deutsch","ES Español"];
let box=document.getElementById("langBox");

langs.forEach(l=>{
let d=document.createElement("div");
d.className="lang-item";
d.innerText=l;
box.appendChild(d);
});

function toggleLang(){
box.classList.toggle("active");
}

document.addEventListener("click",(e)=>{
if(!e.target.closest(".lang-btn")) box.classList.remove("active");
});

</script>

</body>
</html>
