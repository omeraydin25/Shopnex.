<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopnex | İletişim</title>

<style>
:root {
 --bg: #020617;
 --card: rgba(255,255,255,0.05);
 --border: rgba(255,255,255,0.1);
 --text: #e2e8f0;
 --accent: #3b82f6;
}

* {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 font-family: system-ui, sans-serif;
}

body {
 background: radial-gradient(circle at top, #0f172a, #020617);
 color: var(--text);
 min-height: 100vh;
 display: flex;
 align-items: center;
 justify-content: center;
}

/* CONTAINER */
.container {
 width: 100%;
 max-width: 500px;
 padding: 20px;
}

/* CARD */
.card {
 background: var(--card);
 border: 1px solid var(--border);
 border-radius: 20px;
 padding: 40px 30px;
 text-align: center;
 backdrop-filter: blur(20px);
 box-shadow: 0 20px 40px rgba(0,0,0,0.4);
 animation: fadeIn 1s ease;
}

/* TITLE */
.title {
 font-size: 28px;
 font-weight: 800;
 margin-bottom: 10px;
 letter-spacing: -0.5px;
}

.subtitle {
 font-size: 15px;
 color: #94a3b8;
 margin-bottom: 30px;
}

/* USERNAME BOX */
.username-box {
 background: rgba(59,130,246,0.1);
 border: 1px solid rgba(59,130,246,0.3);
 padding: 18px;
 border-radius: 12px;
 font-size: 20px;
 font-weight: bold;
 letter-spacing: 1px;
 margin-bottom: 25px;
 transition: 0.3s;
}

.username-box:hover {
 transform: scale(1.05);
 background: rgba(59,130,246,0.2);
}

/* BUTTON */
.btn {
 display: inline-block;
 background: linear-gradient(135deg, #3b82f6, #2563eb);
 color: white;
 padding: 14px 30px;
 border-radius: 10px;
 font-weight: 600;
 text-decoration: none;
 transition: 0.3s;
 box-shadow: 0 10px 20px rgba(59,130,246,0.3);
}

.btn:hover {
 transform: translateY(-3px);
 box-shadow: 0 15px 30px rgba(59,130,246,0.5);
}

/* LOGO */
.logo {
 font-size: 22px;
 font-weight: 800;
 margin-bottom: 20px;
}

.logo span {
 color: var(--accent);
}

/* ANIMATION */
@keyframes fadeIn {
 from {
  opacity: 0;
  transform: translateY(20px);
 }
 to {
  opacity: 1;
  transform: translateY(0);
 }
}

</style>
</head>

<body>

<div class="container">
 <div class="card">

 <div class="logo">Shop<span>nex</span></div>

 <div class="title">Bizimle İletişime Geç</div>
 <div class="subtitle">Instagram üzerinden hızlıca ulaşabilirsiniz</div>

 <!-- USERNAME -->
 <div class="username-box">
 ____shopnex
 </div>

 <!-- BUTTON -->
 <a href="https://instagram.com/shopnex" target="_blank" class="btn">
 Instagram'a Git
 </a>

 </div>
</div>

</body>
</html>
