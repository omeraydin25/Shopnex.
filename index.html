<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopnex | Profesyonel Platform</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
--primary:#0f172a;
--accent:#2563eb;
--border:#e2e8f0;
--bg:#ffffff;
}

body.dark{
background:#020617;
color:white;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Inter;}

body{background:var(--bg);color:var(--primary);}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
background:rgba(255,255,255,0.9);
backdrop-filter:blur(15px);
border-bottom:1px solid var(--border);
z-index:999;
}

body.dark nav{
background:rgba(2,6,23,0.9);
}

.nav-inner{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
max-width:1200px;
margin:auto;
}

.logo{font-weight:900;font-size:22px;color:var(--accent);}

/* BUTTONS */
.btn{
border:none;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

/* MOBILE MENU */
.hamburger{
width:30px;
cursor:pointer;
}

.hamburger div{
height:3px;
background:var(--primary);
margin:5px 0;
transition:0.3s;
}

body.dark .hamburger div{background:white;}

.mobile-menu{
position:fixed;
top:0;
left:-100%;
width:260px;
height:100vh;
background:white;
padding:80px 20px;
transition:0.3s;
z-index:998;
}

body.dark .mobile-menu{background:#0f172a;}

.mobile-menu.active{left:0;}

.mobile-menu a{
display:block;
padding:10px;
text-decoration:none;
color:inherit;
font-weight:600;
}

/* LANGUAGE */
.language{
position:relative;
}

.lang-btn{
padding:6px 10px;
border:1px solid var(--border);
border-radius:8px;
background:none;
cursor:pointer;
display:flex;
gap:6px;
align-items:center;
}

.lang-menu{
position:absolute;
top:40px;
right:0;
background:white;
border:1px solid var(--border);
display:none;
min-width:140px;
z-index:999;
}

.lang-menu.active{display:block;}

.lang-item{
padding:10px;
cursor:pointer;
}

.lang-item:hover{background:#f1f5f9;}

/* CHAT */
.chat-btn{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:var(--accent);
color:white;
border:none;
cursor:pointer;
}

.chat-box{
position:fixed;
bottom:90px;
right:20px;
width:320px;
height:420px;
background:white;
display:none;
flex-direction:column;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
overflow:hidden;
}

.chat-header{
background:var(--accent);
color:white;
padding:10px;
display:flex;
justify-content:space-between;
}

.chat-messages{
flex:1;
padding:10px;
overflow:auto;
background:#f8fafc;
}

.msg{
margin:5px 0;
padding:8px;
border-radius:10px;
max-width:80%;
}

.user{background:var(--accent);color:white;margin-left:auto;}
.ai{background:white;border:1px solid var(--border);}

.chat-input{
display:flex;
border-top:1px solid var(--border);
}

.chat-input input{
flex:1;
padding:10px;
border:none;
outline:none;
}

.chat-input button{
background:var(--accent);
color:white;
border:none;
padding:10px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<div class="nav-inner">
<div class="hamburger" onclick="toggleMenu()">
<div></div><div></div><div></div>
</div>

<div class="logo">Shopnex</div>

<div style="display:flex;gap:10px;align-items:center">

<button onclick="toggleTheme()" class="btn">🌓</button>

<div class="language">
<button class="lang-btn" onclick="toggleLang()">TR ⌄</button>
<div class="lang-menu" id="langMenu">
<div class="lang-item">Türkçe</div>
<div class="lang-item">English</div>
<div class="lang-item">Deutsch</div>
<div class="lang-item">Español</div>
</div>
</div>

</div>
</div>
</nav>

<!-- MOBILE -->
<div class="mobile-menu" id="menu">
<a href="#">Ana Sayfa</a>
<a href="#">Ürünler</a>
<a href="#">AI Sistem</a>
<a href="#">İletişim</a>
</div>

<!-- CHAT -->
<button class="chat-btn" onclick="toggleChat()">💬</button>

<div class="chat-box" id="chat">
<div class="chat-header">
<span>AI Asistan</span>
<span onclick="toggleChat()" style="cursor:pointer">✖</span>
</div>

<div class="chat-messages" id="msgs">
<div class="msg ai">Merhaba 👋 nasıl yardımcı olayım?</div>
</div>

<div class="chat-input">
<input id="input" placeholder="Mesaj yaz...">
<button onclick="send()">➤</button>
</div>
</div>

<script>

// MENU
function toggleMenu(){
document.getElementById("menu").classList.toggle("active");
}

// THEME
function toggleTheme(){
document.body.classList.toggle("dark");
}

// LANGUAGE
function toggleLang(){
document.getElementById("langMenu").classList.toggle("active");
}

// CHAT
function toggleChat(){
let chat=document.getElementById("chat");
chat.style.display = chat.style.display==="flex"?"none":"flex";
}

function send(){
let input=document.getElementById("input");
if(!input.value) return;

let msg=document.createElement("div");
msg.className="msg user";
msg.innerText=input.value;

document.getElementById("msgs").appendChild(msg);

setTimeout(()=>{
let ai=document.createElement("div");
ai.className="msg ai";
ai.innerText="Bu demo cevap 🤖";
document.getElementById("msgs").appendChild(ai);
},800);

input.value="";
}

</script>

</body>
</html>
